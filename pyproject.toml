[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelffinder"
version = "0.1.0"
description = "Find where a product goes on a printed shelf layout (planogram)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.2",
    "pillow-heif>=0.15",
    "pypdfium2>=4.25",
    "rapidocr-onnxruntime>=1.3",
]

[project.optional-dependencies]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
shelffinder = "shelffinder.cli:main"

[project.gui-scripts]
shelffinder-app = "shelffinder.ui.app:main"

[tool.setuptools.packages.find]
include = ["shelffinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the OCR models and the sample sheets",
    "ui: needs PySide6 and a Qt platform plugin",
]
addopts = "-m 'not slow and not ui'"
